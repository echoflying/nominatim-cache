<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nominatim Cache · 调用方凭据</title>
  <link rel="stylesheet" href="vendor/tabler.min.css?v=20261127-2">
  <link rel="stylesheet" href="css/style.css?v=20261127-2">
</head>
<body>
  <main class="admin-content">
    <header class="page-heading">
      <div><h1>调用方凭据</h1><p class="text-secondary mb-0">为 App、网站或其他调用方创建批量 API 密钥</p></div>
      <button class="btn btn-outline-secondary" id="refreshCredentials"><span data-icon="refresh"></span> 刷新</button>
    </header>
    <section class="card data-card mb-3">
      <div class="card-header"><h2 class="card-title mb-0">创建凭据</h2></div>
      <div class="card-body">
        <p class="text-secondary">调用方 ID 用来统计和隔离批量任务，例如 <code>example-app-android</code>。所有调用方使用同一批量 API。创建第一个有效密钥后，批量 API 会立即启用。密钥可在本页按需查看；轮换时先创建新密钥并更新客户端，再撤销旧密钥。</p>
        <form id="credentialForm" class="row g-3 align-items-end">
          <div class="col-md-4"><label class="form-label" for="callerId">调用方 ID</label><input class="form-control" id="callerId" required maxlength="64" pattern="[a-z][a-z0-9._-]{0,63}" placeholder="例如 example-app-android"></div>
          <div class="col-md-5"><label class="form-label" for="callerLabel">说明</label><input class="form-control" id="callerLabel" required maxlength="100" placeholder="例如 Android 客户端"></div>
          <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">创建并生成密钥</button></div>
        </form>
        <div id="newCredential" class="alert alert-warning mt-3 d-none" role="status">
          <strong>新密钥已创建。之后也可在下方列表中查看。</strong>
          <div class="input-group mt-2"><input class="form-control font-monospace" id="newToken" readonly aria-label="新生成的 Bearer 密钥"><button class="btn btn-outline-secondary" id="copyToken" type="button">复制</button></div>
          <div class="small mt-2">请求时放入请求头：<code>Authorization: Bearer &lt;密钥&gt;</code></div>
        </div>
        <div id="credentialMessage" class="small mt-2" role="status"></div>
      </div>
    </section>
    <section class="card data-card">
      <div class="card-header"><h2 class="card-title mb-0">已创建的凭据</h2></div>
      <div class="table-responsive"><table class="table table-vcenter data-table"><thead><tr><th>调用方 ID</th><th>说明</th><th>密钥提示</th><th>创建时间</th><th>最后使用</th><th>最后查看</th><th>状态</th><th class="text-end">操作</th></tr></thead><tbody id="credentialRows"><tr><td colspan="8" class="table-loading">正在读取…</td></tr></tbody></table></div>
    </section>
    <footer class="admin-footer">Nominatim Cache <span>批量 API 使用统一入口与队列</span></footer>
  </main>
  <script src="js/admin-shell.js?v=20261127-9"></script>
  <script src="js/api.js?v=20261127-9"></script>
  <script src="js/credentials.js?v=20261127-2"></script>
</body>
</html>
