<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nominatim Cache · 最近请求</title>
  <link rel="stylesheet" href="vendor/tabler.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="admin-content">
    <header class="page-heading">
      <div><h1>最近请求</h1><p class="text-secondary mb-0">查看地点查询记录与缓存命中情况</p></div>
      <div class="heading-actions"><span id="requestStatus" class="text-secondary small" role="status">正在读取</span><button class="btn btn-outline-secondary" id="refreshBtn"><span data-icon="refresh"></span> 刷新</button></div>
    </header>
    <section class="card data-card">
      <div class="table-responsive">
        <table class="table table-vcenter table-hover data-table">
          <thead><tr><th>请求时间</th><th>坐标</th><th>缓存状态</th><th>缓存键</th></tr></thead>
          <tbody id="requestTableBody"><tr><td colspan="4" class="table-loading">加载中...</td></tr></tbody>
        </table>
      </div>
    </section>
    <footer class="admin-footer">Nominatim Cache <span>最近 100 条 · 自动刷新</span></footer>
  </main>
  <script src="js/admin-shell.js"></script>
  <script src="js/api.js"></script>
  <script src="js/request-list.js"></script>
</body>
</html>
