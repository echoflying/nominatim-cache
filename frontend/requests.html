<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nominatim Cache · 最近请求</title>
  <link rel="stylesheet" href="vendor/tabler.min.css?v=20261126-5">
  <link rel="stylesheet" href="css/style.css?v=20261126-5">
</head>
<body>
  <main class="admin-content">
    <header class="page-heading">
      <div><h1>最近请求</h1><p class="text-secondary mb-0">查看地点查询记录与缓存命中情况</p></div>
      <div class="heading-actions"><span id="requestStatus" class="text-secondary small" role="status">正在读取</span><button class="btn btn-outline-secondary" id="refreshBtn"><span data-icon="refresh"></span> 刷新</button></div>
    </header>
    <section class="card data-card">
      <div class="table-responsive">
        <table class="table table-vcenter table-hover data-table">
          <thead><tr><th>请求时间</th><th>坐标</th><th>缓存状态</th><th>缓存键</th><th class="text-end">响应详情</th></tr></thead>
          <tbody id="requestTableBody"><tr><td colspan="5" class="table-loading">加载中...</td></tr></tbody>
        </table>
      </div>
    </section>
    <footer class="admin-footer">Nominatim Cache <span>最近 100 条 · 自动刷新</span></footer>
  </main>
  <dialog id="requestDetail" class="request-detail" aria-labelledby="requestDetailTitle">
    <header class="request-detail-header">
      <div><h2 id="requestDetailTitle" class="h3 mb-1">请求响应</h2><div id="requestDetailStatus" class="text-secondary" role="status"></div></div>
      <form method="dialog"><button class="btn btn-outline-secondary" autofocus>关闭</button></form>
    </header>
    <div class="request-detail-panels">
      <section><h3 id="requestUpstreamTitle" class="h4">上游原始响应</h3><pre id="requestUpstream" aria-labelledby="requestUpstreamTitle" tabindex="0"></pre></section>
      <section><h3 id="requestOutputTitle" class="h4">最终输出</h3><pre id="requestOutput" aria-labelledby="requestOutputTitle" tabindex="0"></pre></section>
    </div>
  </dialog>
  <script src="js/admin-shell.js?v=20261126-5"></script>
  <script src="js/api.js?v=20261126-5"></script>
  <script src="js/request-list.js?v=20261126-5"></script>
</body>
</html>
