<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nominatim Cache · 概览</title>
  <link rel="stylesheet" href="vendor/tabler.min.css?v=20261126-2">
  <link rel="stylesheet" href="css/style.css?v=20261126-2">
</head>
<body>
  <main class="admin-content">
    <header class="page-heading">
      <div><h1>服务概览</h1><p class="text-secondary mb-0">查看地点缓存与服务访问情况</p></div>
      <div class="heading-actions">
        <a href="list.html" class="btn btn-primary">查看缓存清单 <span data-icon="arrow-right"></span></a>
        <button class="btn btn-outline-secondary" id="refreshBtn"><span data-icon="refresh"></span> 刷新</button>
        <button class="btn btn-outline-danger" id="clearCacheBtn"><span data-icon="trash"></span> 清空缓存</button>
      </div>
    </header>

    <section class="stats-grid" aria-label="缓存与访问统计">
      <article class="card stat-card"><span class="stat-icon blue" data-icon="database"></span><div><div class="stat-label">缓存地点</div><strong class="stat-value" id="cacheCount">-</strong></div></article>
      <article class="card stat-card"><span class="stat-icon azure" data-icon="activity"></span><div><div class="stat-label">累计请求</div><strong class="stat-value" id="totalRequests">-</strong></div></article>
      <article class="card stat-card"><span class="stat-icon green" data-icon="circle-check"></span><div><div class="stat-label">缓存命中</div><strong class="stat-value" id="cacheHits">-</strong></div></article>
      <article class="card stat-card"><span class="stat-icon orange" data-icon="chart-bar"></span><div><div class="stat-label">缓存命中率</div><strong class="stat-value" id="hitRate">-</strong><span class="stat-footnote">未命中 <span id="cacheMisses">-</span></span></div></article>
    </section>

    <section class="card trend-card">
      <div class="card-header"><div><h2 class="card-title">近 7 天请求趋势</h2><div class="text-secondary small">命中与未命中请求</div></div><a class="btn btn-sm btn-outline-secondary" href="requests.html"><span data-icon="list-details"></span> 最近请求</a></div>
      <div class="chart-container"><canvas id="trendChart" aria-label="近七天缓存命中与未命中趋势"></canvas></div>
    </section>
    <footer class="admin-footer">Nominatim Cache <span>地点反查与缓存管理</span></footer>
  </main>
  <script src="js/admin-shell.js?v=20261126-2"></script>
  <script src="js/api.js?v=20261126-2"></script>
  <script src="js/dashboard.js?v=20261126-2"></script>
</body>
</html>
