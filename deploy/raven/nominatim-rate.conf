# Include at http scope. Do not use caller-supplied forwarding headers as the key.
limit_req_zone $binary_remote_addr zone=nominatim_reverse:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=nominatim_batch_submit:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=nominatim_batch_poll:1m rate=120r/m;
