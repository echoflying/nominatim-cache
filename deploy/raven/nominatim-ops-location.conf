# Include in the x.zaitu.cn HTTPS vhost alongside the shared OPS snippet.
location = /ops/nominatim {
    return 308 /ops/nominatim/;
}

location ^~ /ops/nominatim/ {
    set $ops_system nominatim;
    auth_request /ops/_auth;
    auth_request_set $ops_audit_user $upstream_http_x_sso_user;
    access_log /var/log/nginx/ops-access.jsonl ops_audit;
    error_page 401 = @nominatim_ops_login;

    proxy_pass http://127.0.0.1:18198/;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_hide_header WWW-Authenticate;
    include /etc/nominatim-cache/ops-upstream-auth.conf;
    proxy_read_timeout 130s;
    client_max_body_size 1m;
}

location @nominatim_ops_login {
    if ($uri ~ "^/ops/nominatim/((list|requests)[.]html)?$") {
        return 302 /ops/;
    }
    types { }
    default_type "application/json; charset=utf-8";
    return 401 '{"success":false,"error":"OPS 会话已过期，请到 /ops/ 重新登录"}';
}
