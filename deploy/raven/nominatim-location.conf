# Include within the existing x.zaitu.cn HTTPS server.
# Keep the prefix so the API can generate the correct batch status links.
location = /nominatim {
    return 308 /nominatim/$is_args$args;
}

location /nominatim/ {
    proxy_pass http://127.0.0.1:18197;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
    client_max_body_size 1m;
}
