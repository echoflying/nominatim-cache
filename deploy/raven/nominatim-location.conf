# Include inside the existing x.zaitu.cn HTTPS server.
location = /nominatim {
    return 302 /nominatim/help;
}

location = /nominatim/ {
    return 302 /nominatim/help;
}

location = /nominatim/reverse {
    limit_req zone=nominatim_reverse burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @nominatim_rate_limited;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
    proxy_set_header Host $host;
    proxy_read_timeout 12s;
    proxy_pass http://127.0.0.1:18197/nominatim/reverse;
}

location = /nominatim/health {
    proxy_set_header Host $host;
    proxy_read_timeout 4s;
    proxy_pass http://127.0.0.1:18197/nominatim/health;
}

location = /nominatim/help {
    proxy_set_header Host $host;
    proxy_read_timeout 4s;
    proxy_pass http://127.0.0.1:18197/nominatim/help;
}

location ^~ /nominatim/ {
    return 404;
}

location @nominatim_rate_limited {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Retry-After" always;
    add_header Retry-After 2 always;
    add_header Cache-Control no-store always;
    return 429 '{"error":"Too many reverse requests"}';
}
