# Include only in a private HTTPS virtual host for the administration UI.
# Add the operator network here if the trusted ingress is not local.
location / {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:18198;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
    client_max_body_size 1m;
}
