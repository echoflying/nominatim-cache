# Include in the HTTPS virtual host for nc.zaitu.cn.
location = /api/reverse {
    proxy_pass http://127.0.0.1:18197;
    proxy_set_header Host nc.zaitu.cn;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 8s;
}

location = /health {
    proxy_pass http://127.0.0.1:18197;
    proxy_set_header Host nc.zaitu.cn;
}
